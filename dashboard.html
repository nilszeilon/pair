<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pair — Sessions</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a1a;color:#e0e0e0;padding:24px;max-width:800px;margin:0 auto}
  h1{font-size:1.4rem;margin-bottom:24px;color:#aaa}
  .new-session{background:#252525;border:1px solid #333;border-radius:8px;padding:14px 16px;margin-bottom:24px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .new-session .field{display:flex;flex-direction:column;gap:3px}
  .new-session label{font-size:0.7rem;color:#999}
  .new-session input{background:#1a1a1a;border:1px solid #444;border-radius:6px;color:#e0e0e0;padding:6px 10px;font-size:0.85rem;outline:none;width:140px}
  .new-session input:focus{border-color:#6cf}
  .new-session button{background:#365;border:1px solid #4a7;color:#d0ffd0;border-radius:6px;padding:6px 16px;font-size:0.85rem;cursor:pointer;font-weight:600}
  .session-list{display:flex;flex-direction:column;gap:8px}
  .session-card{background:#252525;border:1px solid #333;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .session-card .info{flex:1;min-width:0}
  .session-card .name{font-weight:700;font-size:0.95rem;margin-bottom:2px}
  .session-card .meta{font-size:0.72rem;color:#888}
  .status{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
  .status.alive{background:#4c6;box-shadow:0 0 6px #4c6}
  .session-card a{color:#6cf;text-decoration:none;font-size:0.8rem;font-weight:600;white-space:nowrap}
  .empty{text-align:center;color:#666;padding:40px 0;font-size:0.9rem}
  .footer{margin-top:24px;text-align:center;font-size:0.65rem;color:#555}
  @media(max-width:500px){body{padding:14px}.new-session input{width:120px}}
</style>
</head>
<body>
<h1>Sessions</h1>

<div class="new-session">
  <div class="field">
    <label for="agent">Agent</label>
    <input id="agent" value="pi" placeholder="pi">
  </div>
  <div class="field">
    <label for="root_path">Path</label>
    <input id="root_path" value="~" placeholder="~/dev/myproject">
  </div>
  <button id="start-btn">Start</button>
</div>

<div class="session-list" id="session-list"></div>
<p class="footer">Refreshes every 2s</p>

<script>
function render() {
  fetch('/sessions').then(r => r.json()).then(sessions => {
    var list = document.getElementById('session-list');
    if (!sessions.length) {
      list.innerHTML = '<div class="empty">No active sessions.<br>Run pair &lt;agent&gt; in a terminal.</div>';
      return;
    }
    list.innerHTML = sessions.map(s => {
      var alive = s.pi_alive !== false;
      return '<div class="session-card">' +
        '<div class="info">' +
          '<div class="name">' + esc(s.id) + '</div>' +
          '<div class="meta">' +
            '<span class="status ' + (alive ? 'alive' : '') + '"></span>' +
            (alive ? 'live' : 'stopped') +
            ' · ' + esc(s.agent) +
            ' · ' + (s.adopted ? 'adopted' : 'managed') +
          '</div>' +
        '</div>' +
        '<a href="' + esc(s.url) + '" target="_blank">Open →</a>' +
      '</div>';
    }).join('');
  });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('start-btn').addEventListener('click', function() {
  var agent = document.getElementById('agent').value || 'pi';
  var root_path = document.getElementById('root_path').value || '~';
  fetch('/sessions', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({root_path,agent})}).then(render);
});

render();
setInterval(render, 2000);
</script>
</body>
</html>
